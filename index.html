<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Residence Villa – Luxury Gallery</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    padding: 0;
    text-align: center;
    background: linear-gradient(to bottom, #000000, #1a1a1a);
    color: #f5d36b; /* gold text */
  }

  h1 {
    padding: 25px 0;
    font-size: 34px;
    color: #f5d36b;
    text-shadow: 0 0 10px #f5d36b88;
  }

  .section-title {
    font-size: 26px;
    margin-top: 40px;
    margin-bottom: 10px;
    color: #ffdf7e;
    font-weight: bold;
    text-shadow: 0 0 10px #f5d36b55;
  }

  .line {
    width: 160px;
    height: 3px;
    margin: auto;
    background: linear-gradient(to right, #b8860b, #f5d36b, #b8860b);
    border-radius: 5px;
    margin-bottom: 25px;
  }

  .gallery-box {
    padding: 10px 20px;
    margin: 0 auto;
    max-width: 1100px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }

  .gallery-box img {
    width: 250px;
    height: 170px;
    object-fit: cover;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
    border: 2px solid #f5d36b55;
    box-shadow: 0 0 15px #f5d36b33;
  }

  .gallery-box img:hover {
    transform: scale(1.07);
    box-shadow: 0 0 20px #f5d36bbb;
    border-color: #f5d36b;
  }

  /* Modal */
  #modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  #modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 15px;
    border: 3px solid #f5d36b;
    box-shadow: 0 0 30px #f5d36b99;
    transition: transform 0.3s;
  }
</style>
</head>
<body>

<h1>✨ Residence Villa ✨</h1>

<!-- OUTDOOR -->
<div class="section-title">🏝️ Outdoor Area</div>
<div class="line"></div>
<div class="gallery-box" id="outdoorBox"></div>

<!-- ROOMS -->
<div class="section-title">🏨 Rooms & Interior</div>
<div class="line"></div>
<div class="gallery-box" id="roomsBox"></div>

<!-- FOOD -->
<div class="section-title">🍽️ Food & Drinks</div>
<div class="line"></div>
<div class="gallery-box" id="foodBox"></div>

<!-- MODAL -->
<div id="modal">
  <img id="modalImg" src="">
</div>

<script>
  const outdoorImages = [
    "https://files.catbox.moe/51n7ne.jpg",
    "https://files.catbox.moe/b97kho.jpg",
    "https://files.catbox.moe/lj91ie.jpg",
    "https://files.catbox.moe/edpw0f.jpg",
    "https://files.catbox.moe/hxne9t.jpg",
    "https://files.catbox.moe/ffh1go.jpg"

  ];

  const roomImages = [
    "https://files.catbox.moe/0kug58.jpg",
    "https://files.catbox.moe/sphx8g.jpg",
    "https://files.catbox.moe/lnw481.jpg",
    "https://files.catbox.moe/i0954d.jpg",
    "https://files.catbox.moe/dmkyty.jpg",
    "https://files.catbox.moe/n0t3q1.jpg"
  ];

  const foodImages = [
    "https://files.catbox.moe/6k3n91.jpg", 
    "https://files.catbox.moe/w2xyjg.jpg",
    "https://files.catbox.moe/pa5no7.jpg",
    "https://files.catbox.moe/56amef.jpg"
  ];

  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");

  function loadImages(list, boxId) {
    const box = document.getElementById(boxId);
    list.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.onclick = () => {
        modal.style.display = "flex";
        modalImg.src = url;
        modalImg.style.transform = "scale(1)";
      };
      box.appendChild(img);
    });
  }

  loadImages(outdoorImages, "outdoorBox");
  loadImages(roomImages, "roomsBox");
  loadImages(foodImages, "foodBox");

  modal.onclick = (e) => {
    if (e.target !== modalImg) modal.style.display = "none";
  };
</script>

</body>
</html>
