<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Image Gallery</title>
<style>
  body { 
    font-family: Arial; 
    text-align: center; 
    padding: 20px; 
    background: linear-gradient(to bottom, #d4edda, #a8e6a3); /* soft green gradient */
    color: #1b3a1b; /* dark green text */
  }

  h1 { 
    margin-bottom: 30px; 
    text-shadow: 1px 1px 2px #ffffffaa;
  }

  #gallery { 
    display: flex; 
    flex-wrap: wrap; 
    justify-content: center; 
    gap: 15px; 
  }

  #gallery img {
    width: 200px;
    height: 150px;
    object-fit: cover;
    border-radius: 15px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  #gallery img:hover { 
    transform: scale(1.05); 
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  }

  /* Modal */
  #modal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0, 50, 0, 0.8); /* dark transparent green */
    justify-content: center;
    align-items: center;
    z-index:1000;
  }
  #modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 15px;
    transition: transform 0.3s;
    box-shadow: 0 8px 16px rgba(0,0,0,0.5);
  }

  /* Optional: subtle background pattern like leaves */
  body::before {
    content: "";
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background-image: url('https://www.transparenttextures.com/patterns/green-fibers.png'); /* soft texture */
    opacity: 0.1;
    z-index: -1;
  }
</style>
</head>
<body>
<h1>🌿Residence Villa🌿</h1>
<div id="gallery"></div>

<div id="modal">
  <img id="modalImg" src="">
</div>

<script>
  const imageUrls = [
    "https://files.catbox.moe/51n7ne.jpg",
    "https://files.catbox.moe/b97kho.jpg",
    "https://files.catbox.moe/rrum84.jpg",
    "https://files.catbox.moe/529f12.jpg"
  ];

  const gallery = document.getElementById('gallery');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');

  imageUrls.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.addEventListener('click', () => {
      modal.style.display = 'flex';
      modalImg.src = url;
      modalImg.style.transform = 'scale(1)';
    });
    gallery.appendChild(img);
  });

  modal.addEventListener('click', e => {
    if(e.target !== modalImg) modal.style.display = 'none';
  });

  modalImg.addEventListener('wheel', e => {
    e.preventDefault();
    let scale = Number(modalImg.style.transform.replace('scale(','').replace(')','')) || 1;
    scale += e.deltaY * -0.001;
    scale = Math.min(Math.max(.5, scale), 3);
    modalImg.style.transform = `scale(${scale})`;
  });
</script>
</body>
</html>
